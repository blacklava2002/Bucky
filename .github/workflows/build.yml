name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One build per branch at a time, so two quick pushes can't race on the branch's dev build.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the phone side
        run: TZ=America/New_York npm test
      - name: Install Pebble SDK
        run: |
          pipx install uv
          pipx install pebble-tool
          pebble sdk install latest
      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$VERSION' isn't MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NAME=$(node -p "require('./package.json').pebble.displayName")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "pbw=${NAME}_$VERSION.pbw" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          pebble build
          cp build/*.pbw "${{ steps.version.outputs.pbw }}"
      # Screenshots from the emulator, printed into the log as base64 between SHOT lines.
      # Never fails the build: the emulator is a nice-to-have. Skipped on main so releases are quick.
      - name: Screenshots
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0 libpixman-1-0 libfdt1 libglib2.0-0 > /dev/null
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          mkdir -p shots
          # A throwaway copy with a fake weather reading and messaging plugin, so the reply and send screens can be shown.
          ROOT=$PWD; DEMO=$(mktemp -d); cp -r . "$DEMO"; cat .github/emulator/demo-weather.js .github/emulator/demo-plugins.js >> "$DEMO/src/pkjs/index.js"
          # "Confirm transcription" on, so a dictated line stops on the check screen.
          { echo "localStorage.setItem('confirm','true');"; cat "$DEMO/src/pkjs/index.js"; } > "$DEMO/index.tmp" && mv "$DEMO/index.tmp" "$DEMO/src/pkjs/index.js"
          (cd "$DEMO" && pebble build > /dev/null) || DEMO=$ROOT
          for P in emery basalt chalk; do
            E="--emulator $P"
            press() { pebble emu-button click "$@" $E; sleep 1.5; }
            shoot() { pebble screenshot $E --no-open "$ROOT/shots/$P-$1.png" || true; }
            cd "$DEMO"; pebble install $E || { cd "$ROOT"; continue; }
            pebble emu-time-format --format 12h $E || true
            sleep 6
            shoot home
            press up; shoot prompts
            press select; sleep 4; shoot reply
            press down; shoot reply-scrolled
            press down; shoot reply-end
            press back; sleep 2
            press up; press down; press select; sleep 4; shoot timer-set
            press up; press down; press down; press down; press down; press select; sleep 4; shoot alarm-set
            press down; shoot menu
            press select; shoot alarms
            press back; press down; press select; shoot timers
            press back; press back; sleep 1
            press up; for i in 1 2 3 4 5 6 7 8; do press down; done; press select; sleep 4; shoot message-check
            press down; shoot message-check-stopped
            press select; sleep 4; shoot message-sent
            press up; for i in 1 2 3 4 5 6 7 8 9; do press down; done; press select; sleep 4; shoot did-you-mean
            press up; sleep 4; shoot did-you-mean-alarm
            pebble install $E > /dev/null 2>&1; sleep 6
            (timeout 30 pebble transcribe "Tell Sam I'm running about ten minutes late, traffic is backed up past the circle, so start without me and save me a seat near the front" $E > /dev/null 2>&1 &)
            sleep 3; press select; sleep 8; shoot transcript-check
            press down; shoot transcript-check-stopped
            press back; sleep 1
            pebble kill || true
            cd "$ROOT"
          done
          # The home and reply screens again with colours picked in settings: a dark and a light pair.
          # Wiped first, so a timer set above can't ring over these.
          pebble wipe > /dev/null 2>&1 || true
          for V in "dark 209 248" "light 239 241"; do
            set -- $V; LOOK=$1
            C=$(mktemp -d); cp -r "$DEMO/." "$C"; rm -rf "$C/build"
            { printf "localStorage.setItem('bgColor','%s');localStorage.setItem('clockColor','%s');\n" "$2" "$3"; cat "$DEMO/src/pkjs/index.js"; } > "$C/src/pkjs/index.js"
            (cd "$C" && pebble build > /dev/null) || continue
            for P in emery basalt diorite; do
              E="--emulator $P"
              press() { pebble emu-button click "$@" $E; sleep 1.5; }
              shoot() { pebble screenshot $E --no-open "$ROOT/shots/$P-$1-$LOOK.png" || true; }
              cd "$C"; pebble install $E || { cd "$ROOT"; continue; }
              pebble emu-time-format --format 12h $E || true
              sleep 6
              shoot home
              press up; press select; sleep 4; shoot reply
              pebble kill || true
              cd "$ROOT"
            done
          done
          # The settings page, in Chrome, fed by the real phone side.
          node .github/emulator/settings-preview.js > settings-preview.html && \
            google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=412,9000 \
              --screenshot="$ROOT/shots/settings.png" "file://$ROOT/settings-preview.html" > /dev/null 2>&1 || true
          for f in shots/*.png; do echo "SHOT $f"; base64 -w0 "$f"; echo; echo "END SHOT"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}_${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.pbw }}
      # A dev build per branch: every push to a branch other than main replaces that branch's
      # pre-release (tag dev-<branch>) with a fresh .pbw to sideload. Pre-releases never go to the
      # app store and aren't versions, so nothing here touches the releases below.
      - name: Publish a dev build for this branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          PBW: ${{ steps.version.outputs.pbw }}
        run: |
          set -euo pipefail
          SLUG=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          TAG="dev-$SLUG"
          FILE="${NAME}_${VERSION}-${SLUG}.pbw"
          cp "$PBW" "$FILE"
          gh release delete "$TAG" --cleanup-tag --yes > /dev/null 2>&1 || true
          printf 'Dev build of the %s branch at %s, for sideloading. Not a release: it never goes to the app store, and the next push to %s replaces it.\n' "$BRANCH" "${GITHUB_SHA:0:7}" "$BRANCH" > dev-notes.md
          gh release create "$TAG" "$FILE" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$NAME dev build: $BRANCH" --notes-file dev-notes.md
          echo "::notice::Dev build for $BRANCH: $(gh release view "$TAG" --json url --jq .url)"
      # A release per version: bump "version" in package.json and push to main.
      # A push that doesn't change the version still builds and tests, but publishes nothing.
      - name: Publish a release for a new version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          PBW: ${{ steps.version.outputs.pbw }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; bump the version in package.json to publish a new one."
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          section() {
            LINES=$(git log --no-merges --format=%s "$RANGE" | grep -E "^$1(\([^)]*\))?!?: " | sed -E "s/^$1(\(([^)]*)\))?!?: /- **\2:** /; s/^- \*\*:\*\* /- /" || true)
            if [ -n "$LINES" ]; then printf '## %s\n\n%s\n\n' "$2" "$LINES"; fi
          }
          { section feat Features; section fix Fixes; section perf Performance; } > notes.md
          if [ ! -s notes.md ]; then echo "Maintenance release." > notes.md; fi
          if [ -n "$PREV" ]; then echo "Changes since $PREV." >> notes.md; fi
          cat notes.md
          gh release create "v$VERSION" "$PBW" --target "$GITHUB_SHA" \
            --title "$NAME $VERSION" --notes-file notes.md
          # The store shows plain text: the same notes without the Markdown.
          sed -E 's/^## //; s/\*\*//g' notes.md > store-notes.txt
          echo "created=true" >> "$GITHUB_OUTPUT"
      # Adds the new version to the app's existing store listing. It never creates a listing:
      # the first upload is done by hand in the developer dashboard (as Unlisted), and until
      # then this step finds no app for this UUID and skips. Needs the repo secret
      # PEBBLE_APPSTORE_REFRESH_TOKEN, the refresh_token from `pebble login`'s
      # oauth_firebase/firebase_oauth_storage.json. A failed upload fails the run; the GitHub
      # release above is already out either way, and the .pbw can be uploaded by hand.
      # Pushes to other branches do a dry run: the same sign-in and lookup, no upload.
      - name: Upload the new version to the Pebble app store
        if: steps.release.outputs.created == 'true' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          DRY_RUN: ${{ steps.release.outputs.created != 'true' }}
          REFRESH_TOKEN: ${{ secrets.PEBBLE_APPSTORE_REFRESH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PBW: ${{ steps.version.outputs.pbw }}
        run: |
          set -euo pipefail
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::notice::No PEBBLE_APPSTORE_REFRESH_TOKEN secret, so the store upload is skipped."
            exit 0
          fi
          # Same endpoints and key pebble-tool uses (pebble_tool.firebase_account, commands/publish.py).
          TOOL_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/pebble-tool/bin/python"
          eval "$("$TOOL_PY" -c 'from pebble_tool import firebase_account as f; print("API_KEY=" + f.DEFAULT_FIREBASE_API_KEY); print("API=" + f.DEFAULT_APPSTORE_API_BASE)')"
          : "${API_KEY:?could not read the store settings from pebble-tool}" "${API:?}"
          # call METHOD URL [curl args...]: prints the body; on an HTTP error it says why and returns 1.
          call() {
            local method=$1 url=$2; shift 2
            local where=${url%%\?*} code
            code=$(curl -sS -o resp.json -w '%{http_code}' -X "$method" "$@" "$url") || { echo "::error::$method $where didn't connect" >&2; return 1; }
            if [ "$code" -ge 400 ]; then
              echo "::error::$method $where answered $code: $(jq -r '(.error // .message // .code // .) | tostring' resp.json 2>/dev/null | head -c 500)" >&2
              return 1
            fi
            cat resp.json
          }
          ID_TOKEN=$(call POST "https://securetoken.googleapis.com/v1/token?key=$API_KEY" \
            --data-urlencode grant_type=refresh_token --data-urlencode "refresh_token=$REFRESH_TOKEN" | jq -r '.id_token // empty') \
            || { echo "::error::The refresh token was refused. Run pebble login again and update the PEBBLE_APPSTORE_REFRESH_TOKEN secret."; exit 1; }
          [ -n "$ID_TOKEN" ] || { echo "::error::No id_token came back for the refresh token."; exit 1; }
          echo "::add-mask::$ID_TOKEN"
          UUID=$(node -p "require('./package.json').pebble.uuid.toLowerCase()")
          if ! call GET "$API/api/v1/developer/me" -H "Authorization: Bearer $ID_TOKEN" > me.json 2> me.err; then
            if [ "$(jq -r '.code // empty' resp.json 2>/dev/null)" = "DEVELOPER_NOT_LINKED" ]; then
              echo "::notice::This Pebble account has no developer account yet, so the store upload is skipped."
              exit 0
            fi
            cat me.err >&2
            exit 1
          fi
          rm -f me.err
          APP_ID=$(jq -r --arg u "$UUID" '(.app_lookup.by_app_uuid // {}) | to_entries[] | select((.key | ascii_downcase) == $u) | .value' me.json | head -n1)
          rm -f me.json
          if [ -z "$APP_ID" ]; then
            echo "::notice::No store listing for this app yet, so the store upload is skipped. Do the first upload by hand in the developer dashboard."
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: signed in and found the store listing; a release would add $VERSION to it."
            exit 0
          fi
          echo "Adding $VERSION to store app $APP_ID"
          call POST "$API/api/dashboard/apps/$APP_ID/releases" -H "Authorization: Bearer $ID_TOKEN" \
            -F "version=$VERSION" -F "releaseNotes=<store-notes.txt" -F isPublished=true \
            -F replaceScreenshots=false -F "pbwFile=@$PBW;type=application/octet-stream" > /dev/null
          rm -f resp.json
          echo "Uploaded $PBW to the Pebble app store."
